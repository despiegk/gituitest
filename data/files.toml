[[file_contents]]
path = "examples/client_socket.rs"
name = "client_socket.rs"
language = "rust"
lines = 147
size = "4.1 KiB"
content = """//! Unix Socket Client Example
//!
//! Demonstrates how to make JSON-RPC calls to the OSIS server over Unix socket.
//!
//! Start the server first:
//!    cargo run --bin osis -- --socket /tmp/osis.sock
//!
//! Then run this example:
//!    cargo run --example client_socket

use serde_json::{json, Value};
use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};
use tokio::net::UnixStream;

#[tokio::main]
async fn main() -> anyhow::Result<()> {
    let socket_path = "/tmp/osis.sock";

    println!("=== OSIS Unix Socket Client Example ===\\n");
    println!("Connecting to {}...\\n", socket_path);

    let stream = UnixStream::connect(socket_path).await?;
    let (reader, mut writer) = stream.into_split();
    let mut reader = BufReader::new(reader);

    // 1. Store a room
    println!("1. Storing a room...");
    let response = rpc_call(
        &mut writer,
        &mut reader,
        "room_set",
        json!({
            "entity": {
                "roomNumber": 301,
                "roomType": "Penthouse",
                "floor": 3,
                "capacity": 6,
                "pricePerNight": 899,
                "status": "Available",
                "amenities": "WiFi, TV, Mini-bar, Jacuzzi, Private_pool",
            }
        }),
    )
    .await?;
    println!("   Response: {}\\n", response);

    // 2. Get all rooms
    println!("2. Getting all rooms...");
    let response = rpc_call(
        &mut writer,
        &mut reader,
        "room_list",
        json!({}),
    )
    .await?;
    println!("   Response: {}\\n", response);

    // 3. Find rooms by status
    println!("3. Finding available rooms...");
    let response = rpc_call(
        &mut writer,
        &mut reader,
        "room_find",
        json!({
            "query": {
                "status": "Available"
            }
        }),
    )
    .await?;
    println!("   Response: {}\\n", response);

    Ok(())
}

async fn rpc_call(
    writer: &mut tokio::net::unix::OwnedWriteHalf,
    reader: &mut BufReader<tokio::net::unix::OwnedReadHalf>,
    method: &str,
    params: Value,
) -> anyhow::Result<Value> {
    let request = json!({
        "jsonrpc": "2.0",
        "method": method,
        "params": params,
        "id": 1
    });

    let mut request_str = serde_json::to_string(&request)?;
    request_str.push('\\n');
    writer.write_all(request_str.as_bytes()).await?;

    let mut response_line = String::new();
    reader.read_line(&mut response_line).await?;

    let response: Value = serde_json::from_str(&response_line)?;
    Ok(response)
}"""

