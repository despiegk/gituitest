path = "Cargo.toml"
name = "Cargo.toml"
language = "toml"
lines = 42
size = "1.2 KiB"
content = """[workspace]
resolver = "2"
members = [
    "crates/goose",
    "crates/goose-cli",
    "crates/goose-mcp",
    "crates/goose-server",
    "crates/goose-bench",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Block, Inc."]
repository = "https://github.com/block/goose"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true"""
