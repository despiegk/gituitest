<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.name }} - {{ repo.owner }}/{{ repo.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpoly.com/unpoly.min.js"></script>
    <link rel="stylesheet" href="https://unpoly.com/unpoly.min.css">
    <style>
        body { background-color: #0d1117; }
        .repo-header { background-color: #161b22; border-bottom: 1px solid #30363d; }
        .code-container { background-color: #0d1117; }
        .line-numbers { color: #6e7681; user-select: none; }
        pre code { background: transparent !important; }
        .hljs { background: transparent !important; }
    </style>
</head>
<body class="min-h-screen text-gray-200">
    <!-- Top Navigation -->
    <nav class="navbar bg-base-300 border-b border-gray-700 px-4">
        <div class="flex-1 gap-4">
            <a href="/" class="text-xl font-bold text-white flex items-center gap-2">
                <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Gitea
            </a>
        </div>
        <div class="flex-none gap-2">
            <button class="btn btn-ghost btn-sm">Explore</button>
            <div class="dropdown dropdown-end">
                <label tabindex="0" class="btn btn-ghost btn-circle avatar">
                    <div class="w-8 rounded-full bg-primary text-primary-content flex items-center justify-center">
                        <span class="text-sm">U</span>
                    </div>
                </label>
            </div>
        </div>
    </nav>

    <!-- Repository Header -->
    <div class="repo-header px-6 py-4">
        <div class="flex items-center gap-2 mb-2">
            <svg class="w-5 h-5 text-gray-400" fill="currentColor" viewBox="0 0 16 16">
                <path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/>
            </svg>
            <a href="/daisyui/{{ repo.owner }}" class="text-blue-400 hover:underline" up-follow>{{ repo.owner }}</a>
            <span class="text-gray-500">/</span>
            <a href="/daisyui/{{ repo.owner }}/{{ repo.name }}" class="text-blue-400 hover:underline font-semibold" up-follow>{{ repo.name }}</a>
        </div>

        <!-- Breadcrumb -->
        <div class="breadcrumbs text-sm">
            <ul>
                <li><a href="/daisyui/{{ repo.owner }}/{{ repo.name }}" class="text-blue-400" up-follow>{{ repo.name }}</a></li>
                <li>{{ file.path }}</li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="px-6 py-4">
        <!-- File header -->
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-4">
                <div class="dropdown">
                    <label tabindex="0" class="btn btn-sm gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122V6A2.5 2.5 0 0110 8.5H6a1 1 0 00-1 1v1.128a2.251 2.251 0 11-1.5 0V5.372a2.25 2.25 0 111.5 0v1.836A2.492 2.492 0 016 7h4a1 1 0 001-1v-.628A2.25 2.25 0 019.5 3.25z"/></svg>
                        {{ current_branch }}
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </label>
                    <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow bg-base-200 rounded-box w-52">
                        {% for branch in branches %}
                        <li><a>{{ branch.name }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
                <span class="text-sm text-gray-400">{{ file.path }}</span>
            </div>
        </div>

        <!-- File info bar -->
        <div class="bg-base-200 border border-gray-700 rounded-t-lg p-3 flex justify-between items-center">
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <span>{{ file.lines }} lines</span>
                <span>|</span>
                <span>{{ file.size }}</span>
                <span>|</span>
                <span>{{ file.language }}</span>
            </div>
            <div class="flex gap-2">
                <button class="btn btn-sm btn-ghost">Raw</button>
                <button class="btn btn-sm btn-ghost">Permalink</button>
                <button class="btn btn-sm btn-ghost">Blame</button>
                <button class="btn btn-sm btn-ghost">History</button>
                <div class="flex gap-1">
                    <button class="btn btn-sm btn-ghost btn-square">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    </button>
                    <button class="btn btn-sm btn-ghost btn-square">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </button>
                    <button class="btn btn-sm btn-ghost btn-square">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                    </button>
                    <button class="btn btn-sm btn-ghost btn-square">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Code display -->
        <div class="code-container border border-t-0 border-gray-700 rounded-b-lg overflow-auto">
            <pre class="m-0 p-4"><code class="language-{{ file.language }}">{{ file.content }}</code></pre>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
        });
        up.on('up:fragment:inserted', () => {
            document.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
        });
    </script>
</body>
</html>
