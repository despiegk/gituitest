<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file.name }} - {{ repo.owner }}/{{ repo.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://unpoly.com/unpoly.min.js"></script>
    <link rel="stylesheet" href="https://unpoly.com/unpoly.min.css">
    <style>
        body { background-color: #0d1117 !important; }
        .navbar { background-color: #161b22 !important; border-bottom: 1px solid #30363d; }
        .repo-header { background-color: #161b22; border-bottom: 1px solid #30363d; }
        .form-control, .form-select { background-color: #0d1117 !important; border-color: #30363d !important; }
        .btn-outline-secondary { border-color: #30363d; color: #c9d1d9; }
        .btn-outline-secondary:hover { background-color: #30363d; color: #fff; }
        pre code { background: transparent !important; }
        .hljs { background: transparent !important; }
        .line-number { color: #6e7681; user-select: none; }
        .code-line:hover { background-color: #161b22; }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <svg class="bi" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                Gitea
            </a>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-link text-light text-decoration-none">Explore</button>
                <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <span class="text-white small">U</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Repository Header -->
    <div class="repo-header px-4 py-3">
        <div class="d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-book text-secondary"></i>
            <a href="/bootstrap/{{ repo.owner }}" class="text-primary text-decoration-none" up-follow>{{ repo.owner }}</a>
            <span class="text-secondary">/</span>
            <a href="/bootstrap/{{ repo.owner }}/{{ repo.name }}" class="text-primary text-decoration-none fw-semibold" up-follow>{{ repo.name }}</a>
        </div>

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/bootstrap/{{ repo.owner }}/{{ repo.name }}" class="text-primary text-decoration-none" up-follow>{{ repo.name }}</a></li>
                <li class="breadcrumb-item active text-secondary" aria-current="page">{{ file.path }}</li>
            </ol>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="container-fluid px-4 py-4">
        <!-- File header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-3">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-diagram-2"></i>
                        {{ current_branch }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark">
                        {% for branch in branches %}
                        <li><a class="dropdown-item" href="#">{{ branch.name }}</a></li>
                        {% endfor %}
                    </ul>
                </div>
                <span class="text-secondary small">{{ file.path }}</span>
            </div>
        </div>

        <!-- File info bar -->
        <div class="bg-dark border border-secondary rounded-top p-3 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3 text-secondary small">
                <span>{{ file.lines }} lines</span>
                <span>|</span>
                <span>{{ file.size }}</span>
                <span>|</span>
                <span>{{ file.language }}</span>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-link btn-sm text-secondary text-decoration-none">Raw</button>
                <button class="btn btn-link btn-sm text-secondary text-decoration-none">Permalink</button>
                <button class="btn btn-link btn-sm text-secondary text-decoration-none">Blame</button>
                <button class="btn btn-link btn-sm text-secondary text-decoration-none">History</button>
                <div class="btn-group ms-2 border-start border-secondary ps-2">
                    <button class="btn btn-link btn-sm text-secondary p-1"><i class="bi bi-download"></i></button>
                    <button class="btn btn-link btn-sm text-secondary p-1"><i class="bi bi-clipboard"></i></button>
                    <button class="btn btn-link btn-sm text-secondary p-1"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-link btn-sm text-secondary p-1"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        </div>

        <!-- Code display -->
        <div class="border border-secondary rounded-bottom overflow-auto" style="border-top: none !important;">
            <pre class="m-0 p-4"><code class="language-{{ file.language }}">{{ file.content }}</code></pre>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
        });
        up.on('up:fragment:inserted', () => {
            document.querySelectorAll('pre code').forEach((el) => {
                hljs.highlightElement(el);
            });
        });
    </script>
</body>
</html>
